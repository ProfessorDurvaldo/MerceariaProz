<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercado Proz | Administração</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/estilo.css" rel="stylesheet">
</head>
<body>
  <header class="site-header"><nav class="container navbar py-3">
    <a class="navbar-brand text-white fw-bold" href="index.html"><span class="brand-mark">M</span> Mercado Proz</a>
    <a class="btn btn-outline-light btn-sm ms-auto" href="index.html">Ver catálogo</a>
  </nav></header>
  <main class="container py-5">
    <div class="mb-4"><span class="eyebrow">PAINEL DE CONTROLE</span><h1 class="display-6 fw-bold">Administrar produtos</h1><p class="text-secondary">Cadastre, edite e organize os itens do mercado.</p></div>
    <section class="card panel-card border-0 mb-4"><div class="card-body p-4">
      <h2 class="h5 fw-bold mb-4">Cadastro de produto</h2>
      <form id="formCadastro" class="row g-3">
        <div class="col-md-5"><label class="form-label fw-semibold" for="nome">Nome do produto</label><input class="form-control" type="text" id="nome" placeholder="Ex.: Arroz 5kg" required></div>
        <div class="col-md-3"><label class="form-label fw-semibold" for="preco">Preço (R$)</label><input class="form-control" type="number" min="0" step="0.01" id="preco" placeholder="24,90" required></div>
        <div class="col-md-4"><label class="form-label fw-semibold" for="categoria">Categoria</label><input class="form-control" type="text" id="categoria" placeholder="Ex.: Mercearia" required></div>
        <div class="col-12 d-flex justify-content-end gap-2 pt-2"><button class="btn btn-outline-secondary" type="reset">Limpar</button><button class="btn btn-brand" type="submit">Salvar produto</button></div>
      </form>
    </div></section>
    <section class="card panel-card border-0 overflow-hidden">
      <div class="card-body p-4 pb-2"><h2 class="h5 fw-bold">Produtos cadastrados</h2><p class="small text-secondary">Use as ações para editar ou excluir um produto.</p></div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th class="text-end">Ações</th></tr></thead><tbody id="itens"></tbody></table></div>
    </section>
  </main>
  <script src="assets/js/scriptAdmin.js"></script>
</body>
</html>
